<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · TrackIt</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand-lg">TrackIt</h1>
    <p class="muted">Create an account to start tracking your projects.</p>

    <div id="form-error" class="alert alert-error" hidden></div>

    <form id="register-form" class="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autofocus required>
        <p class="field-error" data-error-for="email" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <p class="hint muted">At least 8 characters.</p>
        <p class="field-error" data-error-for="password" hidden></p>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
        <p class="field-error" data-error-for="confirm_password" hidden></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="muted center">Already registered? <a href="{{ url_for('main.login_page') }}">Log in</a></p>
  </main>

  <script type="module" src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
