{% extends "base.html" %}

{% block title %}Log in · TrackIt{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block body %}
  <main id="main" class="auth-card">
    <button class="icon-btn auth-theme" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <span class="theme-icon" aria-hidden="true">◐</span>
    </button>

    <a class="brand brand-lg" href="/">TrackIt<span class="brand-dot">.</span></a>
    <p class="muted">Log in to manage your projects and tasks.</p>

    <div id="form-error" class="alert alert-error" role="alert" hidden></div>

    <form id="login-form" class="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autofocus required>
        <p class="field-error" data-error-for="email" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" data-error-for="password" hidden></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="muted center">No account yet? <a href="{{ url_for('main.register_page') }}">Create one</a></p>
  </main>
{% endblock %}

{% block scripts %}
  <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
