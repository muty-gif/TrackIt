<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · TrackIt</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand-lg">TrackIt</h1>
    <p class="muted">Log in to manage your projects and tasks.</p>

    <div id="form-error" class="alert alert-error" hidden></div>

    <form id="login-form" class="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autofocus required>
        <p class="field-error" data-error-for="email" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" data-error-for="password" hidden></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="muted center">No account yet? <a href="{{ url_for('main.register_page') }}">Create one</a></p>
  </main>

  <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
